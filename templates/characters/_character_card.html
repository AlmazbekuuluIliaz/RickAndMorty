{% load rm_extras %}
<div class="col">
    <div class="card h-100">
        <a href="{% url 'character_detail' character.pk %}">
            <img src="{{ character.image }}" class="card-img-top" alt="{{ character.name }}" loading="lazy">
        </a>
        <div class="card-body">
            <h5 class="card-title mb-2">
                <a href="{% url 'character_detail' character.pk %}" class="text-reset text-decoration-none stretched-link">
                    {{ character.name }}
                </a>
            </h5>
            <p class="card-text mb-0">
                {% if character.status == 'Alive' %}
                    <span class="badge text-bg-success">{{ character.status|status_ru }}</span>
                {% elif character.status == 'Dead' %}
                    <span class="badge text-bg-danger">{{ character.status|status_ru }}</span>
                {% else %}
                    <span class="badge text-bg-secondary">{{ character.status|status_ru }}</span>
                {% endif %}
                <span class="text-body-secondary">{{ character.species|species_ru }}</span>
            </p>
        </div>
    </div>
</div>
